{% extends "campaigns/base.html" %}

{% block content %}

<style>
.topbar h1 {
    display: none;
}

.delete-container {
    width: 100%;
    min-height: 65vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.delete-card {
    width: 100%;
    max-width: 550px;
    padding: 28px;
    background: white;
    border: 1px solid lightgray;
    border-radius: 12px;
    box-shadow: 0 2px 8px lightgray;
    text-align: center;
}

.delete-icon {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: mistyrose;
    color: firebrick;
    font-size: 24px;
    font-weight: bold;
}

.delete-card h2 {
    color: midnightblue;
    font-size: 21px;
    margin: 0 0 15px;
}

.delete-card p {
    color: slategray;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 12px;
}

.contact-name {
    color: midnightblue;
    font-weight: 700;
}

.warning-text {
    color: firebrick !important;
}

.delete-actions {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 22px;
}

.delete-button {
    background: firebrick;
    border-color: firebrick;
}

.delete-button:hover {
    background: darkred;
    border-color: darkred;
}

.cancel-button {
    background: slategray;
    border-color: slategray;
}

@media(max-width: 500px) {
    .delete-card {
        padding: 20px;
    }

    .delete-actions {
        flex-wrap: wrap;
    }
}
</style>

<div class="delete-container">
    <div class="delete-card">

        <div class="delete-icon">!</div>

        <h2>Confirm Deletion</h2>

        <p>
            Are you sure you want to delete
            <span class="contact-name">{{ contact.name }}</span>?
        </p>

        <p class="warning-text">
            This action cannot be undone.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="delete-actions">
                <button type="submit" class="button delete-button">
                    Yes, Delete
                </button>

                <a href="{% url 'contact_list' %}" class="button cancel-button">
                    Cancel
                </a>
            </div>
        </form>

    </div>
</div>

{% endblock %}
