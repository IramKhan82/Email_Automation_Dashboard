<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EmailFlow</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            color: #1e3a8a;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #dc2626;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">EmailFlow</div>
    <p class="subtitle">Sign in to your dashboard</p>

    {% if form.errors %}
        <p class="error">
            Invalid username or password. Please try again.
        </p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="id_username">Username</label>
        <input
            type="text"
            name="username"
            id="id_username"
            placeholder="Enter your username"
            required
            autofocus
        >

        <label for="id_password">Password</label>
        <input
            type="password"
            name="password"
            id="id_password"
            placeholder="Enter your password"
            required
        >

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit">Login</button>
    </form>

</div>

</body>
</html>
